# Loot for infestation kills and cleared lures. Since the TFMC Act System
# (2026-11-15) these are the only infestation drops: the mobs' MythicMobs
# drop table is gone.
#
# Items are TLibs item paths (m.<type>.<id> for MMOItems).
# Two special item names exist:
#   denars - an amount of denars, paid out as physical coins from the coins list
#   gem    - one gem pouch per unit, its tier rolled from the table's gems weights
#
# percent: chance for the entry to drop, 0-100. Defaults to 100.
# amount:  a number or a range like 4-6. Defaults to 1.
#
# Permadeath zones come from RPCharacters. When RPCharacters is missing, every
# location counts as outside a zone.
#
# Balance (ACT-SYSTEM.md, 2026-11-15): an average player (388 kills an active
# hour) at extreme in a zone earns what an average lucky miner earns in an
# hour, 25.9 Ignitium. The other severities pay 1/3, 1/2 and 3/4 of extreme;
# outside a zone pays half of mild. Tin, abyssalite fragments and dust are
# Ignitium / 40 (the act's trickle ratio). Gems and denars fill the rest of a
# miner's hour. Unknown Keys are unchanged.

enabled: true

# Infestation groups that pay these rewards. An empty list means every group.
groups:
  - swamp_mobs
  - swamp_mobs_hill

# Coin items and their denar value. Denars are paid in the largest coins first.
coins:
  - {item: m.currency.pouch_of_coins, value: 100}
  - {item: m.currency.stack_of_coins, value: 10}
  - {item: m.currency.handful_of_coins, value: 5}
  - {item: m.currency.gold_coin, value: 1}

# One roll per ambient mob killed by a player. Mobs summoned by a dying
# infestation mob (parasitic worms) roll nothing.
ambient:
  # Each player gets at most this many of key-item from ambient kills per
  # rolling hour. 0 turns the cap off. Lure rewards ignore it.
  key-item: m.loot.trial_key
  key-cap-per-hour: 40

  # Used for kills outside a permadeath zone, whatever the severity.
  outside:
    gems:
      - {item: m.loot.basic_gemstone_pouch, weight: 90}
      - {item: m.loot.polished_gemstone_pouch, weight: 10}
    drops:
      - {item: m.loot.trial_key, percent: 0.1}
      - {item: gem, percent: 0.3125}
      - {item: denars, percent: 4.35}
      - {item: m.currency.enchanted_dust, percent: 0.0275}
      - {item: m.materials.ignitium, percent: 1.1}
      - {item: m.materials.raw_tin, percent: 0.0275}
      - {item: m.materials.abyssalite_fragment, percent: 0.0275}

  mild:
    gems:
      - {item: m.loot.basic_gemstone_pouch, weight: 90}
      - {item: m.loot.polished_gemstone_pouch, weight: 10}
    drops:
      - {item: m.loot.trial_key, percent: 2}
      - {item: gem, percent: 0.625}
      - {item: denars, percent: 8.7}
      - {item: m.currency.enchanted_dust, percent: 0.055}
      - {item: m.materials.ignitium, percent: 2.2}
      - {item: m.materials.raw_tin, percent: 0.055}
      - {item: m.materials.abyssalite_fragment, percent: 0.055}

  worrying:
    gems:
      - {item: m.loot.basic_gemstone_pouch, weight: 75}
      - {item: m.loot.polished_gemstone_pouch, weight: 22}
      - {item: m.loot.radiant_gemstone_pouch, weight: 3}
    drops:
      - {item: m.loot.trial_key, percent: 3}
      - {item: gem, percent: 1}
      - {item: denars, percent: 13}
      - {item: m.currency.enchanted_dust, percent: 0.08375}
      - {item: m.materials.ignitium, percent: 3.35}
      - {item: m.materials.raw_tin, percent: 0.08375}
      - {item: m.materials.abyssalite_fragment, percent: 0.08375}

  severe:
    gems:
      - {item: m.loot.basic_gemstone_pouch, weight: 60}
      - {item: m.loot.polished_gemstone_pouch, weight: 30}
      - {item: m.loot.radiant_gemstone_pouch, weight: 9}
      - {item: m.loot.mythical_gemstone_pouch, weight: 1}
    drops:
      - {item: m.loot.trial_key, percent: 4.5}
      - {item: gem, percent: 1.5}
      - {item: denars, percent: 19.5}
      - {item: m.currency.enchanted_dust, percent: 0.125}
      - {item: m.materials.ignitium, percent: 5}
      - {item: m.materials.raw_tin, percent: 0.125}
      - {item: m.materials.abyssalite_fragment, percent: 0.125}

  extreme:
    gems:
      - {item: m.loot.basic_gemstone_pouch, weight: 45}
      - {item: m.loot.polished_gemstone_pouch, weight: 35}
      - {item: m.loot.radiant_gemstone_pouch, weight: 17}
      - {item: m.loot.mythical_gemstone_pouch, weight: 3}
    drops:
      - {item: m.loot.trial_key, percent: 6}
      - {item: gem, percent: 2}
      - {item: denars, percent: 26}
      - {item: m.currency.enchanted_dust, percent: 0.1675}
      - {item: m.materials.ignitium, percent: 6.7}
      - {item: m.materials.raw_tin, percent: 0.1675}
      - {item: m.materials.abyssalite_fragment, percent: 0.1675}

# When a lure clears, each committed player who is alive and online and made at
# least min-kills lure kills gets their own burst of items from the lure. Only
# that player can pick their items up.
lure:
  min-kills: 3

  # Each lure kill a player made rolls the ambient table for the lure's place
  # (its zone severity, or outside) this many times. Key items are left out of
  # these rolls; the tables below pay the lure's keys. Lures run out and are
  # risky, so they pay more than ambient kills. 0 turns this off.
  multiplier: 5

  # Lures outside a permadeath zone roll the tables below, then each item
  # survives with keep-percent. keep-items overrides it per item.
  outside-zone:
    keep-percent: 5

  # A flat bonus for each player, on top of the per-kill rolls.
  mild:
    drops:
      - {item: m.loot.trial_key, amount: 4-6}

  worrying:
    drops:
      - {item: m.loot.trial_key, amount: 7-10}

  severe:
    drops:
      - {item: m.loot.trial_key, amount: 10-14}

  extreme:
    drops:
      - {item: m.loot.trial_key, amount: 14-20}
