debug: false
logging: false
wipe-log: true

# Neighbor spread. Keep false on the test server so set infestations stay put.
# Can hop across a single water or sea tile, never onto water/sea, never two tiles.
spread: false
spread-interval-seconds: 600
worsen-chance: 0.0015
spread-chance-land:
  mild: 0.00099
  worrying: 0.0030
  severe: 0.0050
  extreme: 0.00694
spread-chance-water:
  mild: 0.00040
  worrying: 0.0012
  severe: 0.0020
  extreme: 0.00278
spread-chance-sea:
  mild: 0.00015
  worrying: 0.00045
  severe: 0.00075
  extreme: 0.00104

lure-item: ia.tfmc:lure
join-seconds: 20
lure-spawn-radius: 48
# No ambient or lure mob spawns closer than this to any player. Raises the
# ambient ring minimum and the lure ring minimum when they are smaller.
min-player-distance: 16
logout-grace-seconds: 300
# Hearts are 2 health. Applied each second to uncommitted players who stay
# after a lure starts, and to committed players who leave the province.
deserter-damage: 2
# Rivers and lakes are provinces of their own. A player in one still counts
# as inside a lure's province while that province's land is within this many
# blocks (0 to 64). 0 counts every river as outside.
river-reach: 16
hologram-view-range: 96
# Ambient and lure mobs only spawn where nothing that blocks movement is above
# them (leaves don't count), so never in caves or under roofs. Spots inside an
# installation's protected radius are always skipped. The last-resort spot at
# the lure itself ignores both rules.
require-open-sky: true
# A lure mob no player in the lure has had in sight for this long is moved next
# to the lure. 0 turns it off.
lure-straggler-seconds: 60
# An ambient mob no player has had in sight for this long is removed (no loot).
# 0 turns it off.
ambient-straggler-seconds: 120

skip-terrains:
  - water
  - sea
